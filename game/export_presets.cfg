[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="rooms/*.txt"
exclude_filter="tools/*, tests/*"
export_path="../build/trash-panic.apk"

[preset.0.options]
launcher_icons/main_192x192="res://core/assets/ui/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://core/assets/ui/icon_fg_432.png"
launcher_icons/adaptive_background_432x432="res://core/assets/ui/icon_bg_432.png"

gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk="29"
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.trashpanic.game"
package/name="TRASH PANIC!"
package/signed=true
package/app_category=2
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=true
permissions/access_network_state=true
permissions/change_network_state=true
permissions/access_wifi_state=true
permissions/change_wifi_state=true
permissions/read_phone_state=true
permissions/wake_lock=true

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="rooms/*.txt"
exclude_filter="tools/*, tests/*"
export_path="../build/web/index.html"

[preset.1.options]
progressive_web_app/icon_144x144="res://core/assets/ui/icon_144.png"
progressive_web_app/icon_180x180="res://core/assets/ui/icon_180.png"
progressive_web_app/icon_512x512="res://core/assets/ui/icon_512.png"

variant/extensions_support=false
variant/thread_support=false
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Trash Panic\">\n<style>html, body { background: #14213D; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/background_color=Color(0.16, 0.13, 0.11, 1)

